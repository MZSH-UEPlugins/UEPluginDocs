<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#71f3ff"/>
      <stop offset="0.55" stop-color="#29a9ff"/>
      <stop offset="1" stop-color="#a45cff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="start">
    <text x="1110" y="400" font-size="82" font-weight="600" letter-spacing="15" fill="#8cdfff">MCP</text>
    <text x="1100" y="540" font-size="132" font-weight="800" letter-spacing="2" fill="url(#title)" filter="url(#glow)">BLUEPRINT</text>
    <rect x="1105" y="590" width="670" height="3" rx="2" fill="#2fc7f4" opacity="0.75"/>
    <text x="1110" y="675" font-size="42" font-weight="500" letter-spacing="1.5" fill="#d9edff">Safe, visual Blueprint automation</text>
    <text x="1110" y="738" font-size="31" font-weight="600" letter-spacing="8" fill="#8faed2">FOR UNREAL EDITOR</text>
  </g>
</svg>
